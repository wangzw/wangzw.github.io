baseURL = "https://zhanwei.wang/"
locale = "en-US"
title = "Zhanwei Wang"
theme = "m10c"
pluralizeListTitles = false
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
hasCJKLanguage = true

[taxonomies]
tag = "tags"

# Markdown rendition of a page, published as index.md next to its index.html.
[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true

# Every kind needs the rendition: Cloudflare rewrites a request that accepts
# text/markdown to <page URL>index.md, and a page without one would answer 404.
[outputs]
home = ["html", "rss", "markdown"]
section = ["html", "rss", "markdown"]
taxonomy = ["html", "rss", "markdown"]
term = ["html", "rss", "markdown"]
page = ["html", "markdown"]

# Tag pages are thin, repeat the site description and are not translated, so they
# stay out of the sitemaps and are marked noindex (see layouts/partials/seo.html).
[[cascade]]
noindex = true
[cascade.sitemap]
disable = true
[cascade.target]
kind = "{taxonomy,term}"

# The tags overview takes its title from the taxonomy name, which Hugo does not
# translate. Setting it here puts the Chinese title into <title>, og:title and the
# heading alike; keep it equal to "Tags" in i18n/zh.toml, which the menu uses.
[[cascade]]
title = "标签"
[cascade.target]
kind = "taxonomy"
[cascade.target.sites.matrix]
languages = ["zh"]

# Related posts shown at the end of a post: shared tags decide, the year breaks ties.
[related]
includeNewer = true
threshold = 80
toLower = true
[[related.indices]]
name = "tags"
weight = 100
[[related.indices]]
name = "date"
weight = 10
pattern = "2006"

[params]
menu_item_separator = " &centerdot; "
avatar = "avatar.jpeg"
favicon = "/favicon.ico"
author_handle = "wangzw"
# Share image (og:image / twitter:image) for pages that set no image of their own.
images = ["avatar.jpeg"]
llms_summary = "Personal blog of Zhanwei Wang. Every post is published in English and in Chinese."

# Sites served under this domain from other repositories. Each one is shown in
# the "Projects" section of the sidebar and listed in /llms.txt (with its llms.txt,
# when it has one). `sitemap` is the project's sitemap, which may be an index: it
# is listed in /robots.txt. `sitemaps` names the leaf sitemaps (urlsets) behind it
# for the root sitemap index, which may not contain another index; without
# `sitemaps` the root index lists `sitemap` itself. languages.zh.params repeats
# the list with the Chinese URLs and description.
[[params.projects]]
name = "peers"
url = "https://zhanwei.wang/peers/"
description = "Cross-host messaging for Claude Code sessions"
llms = "https://zhanwei.wang/peers/llms.txt"
sitemap = "https://zhanwei.wang/peers/sitemap.xml"
sitemaps = ["https://zhanwei.wang/peers/en/sitemap.xml", "https://zhanwei.wang/peers/zh/sitemap.xml"]

[params.baidu]
code = "04dde72fe229b92cb49f307348ec6df9"

[[params.social]]
icon = "brand-github"
name = "Zhanwei Wang"
url = "https://github.com/wangzw"

[[params.social]]
icon = "brand-linkedin"
name = "Zhanwei Wang"
url = "https://www.linkedin.com/in/wangzw/"

