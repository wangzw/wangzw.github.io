name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily at midnight UTC (8am CST)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.should-deploy.outputs.value }}
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Update content submodule
        if: github.event_name != 'push'
        run: git submodule update --remote content

      - name: Check for submodule changes
        if: github.event_name != 'push'
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit submodule update
        if: github.event_name != 'push' && steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Update content submodule"
          git push

      - name: Determine if deploy is needed
        id: should-deploy
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ steps.check.outputs.changed }}" == "true" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Hugo CLI
        if: steps.should-deploy.outputs.value == 'true'
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Pages
        if: steps.should-deploy.outputs.value == 'true'
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Node.js dependencies
        if: steps.should-deploy.outputs.value == 'true'
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build with Hugo
        if: steps.should-deploy.outputs.value == 'true'
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Runs before the deploy, while the live sitemaps still describe the old site.
      # The script reports problems as warnings and exits 0, so this step cannot block the deploy.
      - name: Find URLs that are new or changed since the live site
        if: steps.should-deploy.outputs.value == 'true'
        id: indexnow
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/indexnow.py diff \
            --old "$BASE_URL/en/sitemap.xml" "$BASE_URL/zh/sitemap.xml" \
            --new public/en/sitemap.xml public/zh/sitemap.xml \
            --output "$RUNNER_TEMP/indexnow-urls.txt"
          {
            echo "urls<<INDEXNOW_URLS_EOF"
            cat "$RUNNER_TEMP/indexnow-urls.txt"
            echo "INDEXNOW_URLS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.should-deploy.outputs.value == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tells search engines about the pages this deploy added or changed
  # (https://www.indexnow.org/). It starts only after a successful deploy and runs
  # in its own job: the script reports a failed submission as a warning annotation
  # and exits 0, so the deploy and this workflow stay green either way.
  indexnow:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: needs.deploy.result == 'success' && needs.build.outputs.indexnow_urls != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            static

      - name: Submit the changed URLs to IndexNow
        env:
          INDEXNOW_URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: printf '%s\n' "$INDEXNOW_URLS" | python3 scripts/indexnow.py submit
